# The group master: the indoor unit with the wired remote, which commands go to.
# A unit on its own is its own master. Gets the climate and the group's settings.
# vars:
#   id:       DIII address as two hex digits ("01" = 1-01)
#   name:     device name in Home Assistant
#   area:     id of an area defined under esphome: areas:
#   b1_index: optional, "0x.."; needed for remote-sensors.yaml (docs/configuration.md)
defaults:
  b1_index: "0xFF"  # unknown

esphome:
  devices:
    - id: dev_${id}
      name: ${name}
      area_id: ${area}

daikin_diii:
  units:
    - address: 0x${id}
      group: 0x${id}
      b1_index: ${b1_index}

climate:
  - platform: daikin_diii
    unit: 0x${id}
    name: Climate
    device_id: dev_${id}

select:
  # Airflow direction: the climate entity has no place for flap positions.
  - platform: daikin_diii
    unit: 0x${id}
    name: Airflow direction
    device_id: dev_${id}

sensor:
  - platform: daikin_diii
    unit: 0x${id}
    room_temperature:
      name: Temperature
      device_id: dev_${id}
    setpoint:
      name: Setpoint
      device_id: dev_${id}
    setting_commands:
      name: Setting commands
      device_id: dev_${id}
    write_budget:
      name: Write budget left
      device_id: dev_${id}

binary_sensor:
  - platform: daikin_diii
    unit: 0x${id}
    power:
      name: Power
      device_id: dev_${id}
    heating_active:
      name: Heat demand
      device_id: dev_${id}

text_sensor:
  - platform: daikin_diii
    unit: 0x${id}
    mode:
      name: Mode
      device_id: dev_${id}
    fan:
      name: Fan
      device_id: dev_${id}
