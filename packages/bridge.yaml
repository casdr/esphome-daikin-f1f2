# The P1P2MQTT bridge (v1.2/v1.3) and the system-wide entities.
# Include once; add one unit package per indoor unit.
esp8266:
  board: esp12e
  restore_from_flash: true

logger:
  baud_rate: 0  # UART0 belongs to the ATmega

api:
  actions:
    # Research: write a raw frame (hex without checksum). Needs the write switch.
    - action: write_frame
      variables:
        hex: string
      then:
        - lambda: 'id(daikin_bus).write_frame_hex(hex);'
    # Research: P1P2Monitor command such as "V" (version). Needs the write switch;
    # only V/T/O/G/H are passed on.
    - action: atmega_command
      variables:
        cmd: string
      then:
        - lambda: 'id(daikin_bus).send_atmega_command(cmd);'

uart:
  id: atmega
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 250000
  rx_buffer_size: 1024

daikin_diii:
  id: daikin_bus
  uart_id: atmega
  reset_pin: GPIO5
  serial_enable_pin: GPIO15
  # Update the ATmega firmware from ESPHome (docs/atmega.md).
  # SCK is serial_enable_pin, RESET is reset_pin.
  isp:
    mosi_pin: GPIO2
    miso_pin: GPIO0
  # A Home Assistant notification for each frame type the component doesn't know, while
  # "Unknown frame notifications" is on (docs/debugging.md). Needs "Allow the device to
  # perform Home Assistant actions" in the device's options in HA. The trigger comes again
  # at most once an hour while the type keeps coming, so one missed while HA was away (or
  # the switch was off) comes through later; the notification for a type replaces the last.
  on_unknown_frame:
    - if:
        condition:
          and:
            - switch.is_on: unknown_frame_notifications
            - api.connected:
        then:
          - homeassistant.action:
              action: persistent_notification.create
              data:
                title: "Daikin F1F2: unknown frame"
                notification_id: !lambda 'return "daikin_f1f2_unknown_" + frame_type;'
                # The link opens the "Protocol finding" issue form with the title, the frame and
                # what the bridge knows filled in (query parameters named after the form's field
                # ids, .github/ISSUE_TEMPLATE/protocol.yml); the reporter adds the system and the moment.
                message: !lambda |-
                  auto encode = [](const std::string &text) {
                    std::string out;
                    char escaped[4];
                    for (unsigned char c : text) {
                      if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || (c >= '0' && c <= '9') ||
                          c == '-' || c == '_' || c == '.' || c == '~') {
                        out += (char) c;
                      } else {
                        snprintf(escaped, sizeof(escaped), "%%%02X", c);
                        out += escaped;
                      }
                    }
                    return out;
                  };
                  const std::string bytes = std::to_string(frame.size() / 2);
                  const std::string finding = "Unknown frame type " + frame_type + " (" + bytes +
                      " bytes, checksum included), reported by the bridge's unknown frame notification.\n\n"
                      "Bridge: ESPHome " ESPHOME_VERSION ", device " + App.get_name().str() + ".";
                  const std::string url = "https://github.com/casdr/esphome-daikin-f1f2/issues/new?template=protocol.yml"
                      "&title=" + encode("Unknown frame type " + frame_type) + "&finding=" + encode(finding) +
                      "&frames=" + encode(frame);
                  return "The bridge saw a frame type this component doesn't know yet (" + frame_type + ", " + bytes +
                         " bytes):\n\n`" + frame + "`\n\n[Report it on GitHub](" + url + "): the form opens with this "
                         "frame filled in. Add your Daikin system and what it was doing at that moment.";

sensor:
  - platform: daikin_diii
    outdoor_temperature: {name: Outdoor temperature}
    evaporating_temperature: {name: Evaporating temperature}
    condensing_temperature: {name: Condensing temperature}
    discharge_temperature_1: {name: Discharge temperature module 1}
    discharge_temperature_2: {name: Discharge temperature module 2}
    compressor_step_1: {name: Compressor step module 1}
    compressor_step_2: {name: Compressor step module 2}
    fan_step_1: {name: Outdoor fan step module 1}
    fan_step_2: {name: Outdoor fan step module 2}
    compressor_speed_1: {name: Compressor speed module 1}
    compressor_speed_2: {name: Compressor speed module 2}
    compressor_speed_total: {name: Compressor speed total}
    compressor_current: {name: Compressor current}
    frames_ok: {name: Bus frames OK}
    frames_error: {name: Bus frames with errors}
    write_queue: {name: Bus write queue}
    writes_lost: {name: Bus writes lost}

binary_sensor:
  - platform: daikin_diii
    compressor_running: {name: Compressor}
    defrost: {name: Defrost}
    oil_return: {name: Oil return}

text_sensor:
  - platform: daikin_diii
    clock: {name: System clock}
    last_write: {name: Last bus command, entity_category: diagnostic}

switch:
  - platform: daikin_diii
    # Off = read-only. Starts off until you turn it on, then keeps its state.
    write_enable: {name: Bus writes enabled, restore_mode: RESTORE_DEFAULT_OFF}
    atmega_programming: {name: ATmega programming}
    # Every bus frame to the ESPHome log, for a bus log without MQTT (docs/debugging.md).
    frame_logging: {name: Frame logging}
  # Turns the notification for unknown frame types on (see on_unknown_frame above).
  - platform: template
    id: unknown_frame_notifications
    name: Unknown frame notifications
    icon: mdi:bell-alert-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: daikin_diii
    reset_atmega: {name: Restart ATmega}
