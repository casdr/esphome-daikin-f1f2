name: Bug report
description: Something in the component doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: esphome
    attributes:
      label: ESPHome version
      placeholder: "2026.10.2"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Daikin system
      description: Outdoor unit model, number of indoor units and groups, central controller (iTM or other) if any.
      placeholder: "REYQ10T, 8 indoor units in 3 groups, iTM"
  - type: input
    id: atmega
    attributes:
      label: P1P2Monitor version
      description: The reply to the `atmega_command` action `V`, from the ESPHome log.
  - type: textarea
    id: config
    attributes:
      label: Your daikin_diii config
      description: The `daikin_diii:` block and the packages you include. Leave out secrets.
      render: yaml
  - type: textarea
    id: log
    attributes:
      label: ESPHome log
      description: The relevant part, at log level DEBUG.
      render: text
